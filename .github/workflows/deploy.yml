name: Deploy to WordPress.org

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy release to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(grep -m1 -E '^\s*\*\s*Version:' kp-search-with-raffle.php | awk '{print $NF}')
          STABLE_TAG=$(grep -m1 -iE '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "Release tag: $TAG | Plugin header: $PLUGIN_VERSION | Stable tag: $STABLE_TAG"
          if [ "$TAG" != "$PLUGIN_VERSION" ] || [ "$TAG" != "$STABLE_TAG" ]; then
            echo "::error::Release tag ($TAG) must match the plugin Version ($PLUGIN_VERSION) and readme Stable tag ($STABLE_TAG)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: kp-search-with-raffle

      - name: Attach zip to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.deploy.outputs.zip-path }}" --clobber
